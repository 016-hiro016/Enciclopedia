<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>OMNISSIA // ADMIN</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><header class="topbar"><div class="top-aquila"><img src="{{ url_for('static',filename='img/aquila.png') }}"></div><div><strong>ARCHIVUM // MAGOS ADMIN</strong><small>+++ РАЗРЕШЕНО ХРАНИТЕЛЮ ЗНАНИЙ +++</small></div><div class="top-code"><a href="/admin/logout">ВЫЙТИ</a></div></header><main class="admin-layout"><section class="admin-box wide"><div class="panel-title">☩ НОВАЯ ЗАПИСЬ / РЕДАКТИРОВАНИЕ</div><form method="post" action="/admin/entry/save"><input type="hidden" name="id" id="edit-id"><div class="admin-grid"><input class="admin-input" name="title" id="edit-title" placeholder="Название статьи" required><select class="admin-input" name="category_id" id="edit-category" required>{% for c in categories %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input class="admin-input" name="subcategory" id="edit-subcategory" placeholder="Подкатегория"><input class="admin-input" name="slug" id="edit-slug" placeholder="slug"><input class="admin-input full" name="tags" id="edit-tags" placeholder="Теги через запятую"><textarea class="admin-input full" name="description" id="edit-description" placeholder="Краткое описание"></textarea><textarea class="admin-input full body" name="body" id="edit-body" placeholder="Полный текст статьи"></textarea></div><button class="ritual-btn" type="submit">☩ СОХРАНИТЬ В КОГИТАТОР ☩</button></form></section><section class="admin-box wide"><div class="panel-title">◉ ЗАПИСИ АРХИВА // {{ entries|length }}</div><div class="admin-list">{% for x in entries %}<div class="admin-row"><div><b>{{x.title}}</b><small>{{x.category.name}} // {{x.subcategory}}</small></div><button class="admin-edit" type="button" onclick='editEntry({{x.id|tojson}},{{x.title|tojson}},{{x.slug|tojson}},{{x.subcategory|tojson}},{{x.tags|tojson}},{{x.description|tojson}},{{x.body|tojson}},{{x.category_id}})'>РЕДАКТИРОВАТЬ</button><form method="post" action="/admin/entry/delete/{{x.id}}" onsubmit="return confirm('Удалить запись из архива?')"><button class="admin-delete">УДАЛИТЬ</button></form></div>{% endfor %}</div></section></main><script>function editEntry(id,title,slug,sub,tags,desc,body,cat){for(const [k,v] of Object.entries({"edit-id":id,"edit-title":title,"edit-slug":slug,"edit-subcategory":sub,"edit-tags":tags,"edit-description":desc,"edit-body":body}))document.getElementById(k).value=v;document.getElementById('edit-category').value=cat;window.scrollTo({top:0,behavior:'smooth'})}</script></body></html>
